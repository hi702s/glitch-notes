<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GL1TCH_N0TES // music version control</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508;
    --surface: #0d0d14;
    --surface2: #13131f;
    --border: #2a2a3d;
    --accent1: #ff2d78;
    --accent2: #00f5ff;
    --accent3: #b026ff;
    --accent4: #ffee00;
    --text: #e8e8ff;
    --muted: #6666aa;
    --font-mono: 'Share Tech Mono', monospace;
    --font-main: 'Syne', sans-serif;
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–bg);
color: var(–text);
font-family: var(–font-main);
min-height: 100vh;
overflow-x: hidden;
}

/* scanlines overlay */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background: repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(0,0,0,0.15) 2px,
rgba(0,0,0,0.15) 4px
);
pointer-events: none;
z-index: 1000;
}

/* noise texture */
body::after {
content: ‘’;
position: fixed;
inset: 0;
background-image: url(“data:image/svg+xml,%3Csvg viewBox=‘0 0 256 256’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Cfilter id=‘noise’%3E%3CfeTurbulence type=‘fractalNoise’ baseFrequency=‘0.9’ numOctaves=‘4’ stitchTiles=‘stitch’/%3E%3C/filter%3E%3Crect width=‘100%25’ height=‘100%25’ filter=‘url(%23noise)’ opacity=‘0.04’/%3E%3C/svg%3E”);
pointer-events: none;
z-index: 999;
opacity: 0.5;
}

/* HEADER */
header {
padding: 24px 32px 16px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
position: relative;
overflow: hidden;
}

header::before {
content: ‘’;
position: absolute;
inset: 0;
background: linear-gradient(135deg, rgba(255,45,120,0.06) 0%, rgba(176,38,255,0.06) 50%, rgba(0,245,255,0.06) 100%);
}

.logo {
font-family: var(–font-mono);
font-size: 22px;
letter-spacing: 4px;
position: relative;
}

.logo .gl {
color: var(–accent1);
text-shadow: 0 0 20px var(–accent1), 2px 0 0 var(–accent2);
animation: glitch-logo 4s infinite;
}

.logo .rest { color: var(–accent2); text-shadow: 0 0 20px var(–accent2); }

@keyframes glitch-logo {
0%, 90%, 100% { text-shadow: 0 0 20px var(–accent1), 2px 0 0 var(–accent2); transform: none; }
92% { transform: translateX(-2px); text-shadow: 2px 0 var(–accent2), -2px 0 var(–accent1); }
94% { transform: translateX(2px); text-shadow: -2px 0 var(–accent3), 2px 0 var(–accent4); }
96% { transform: translateX(-1px); }
}

.header-stats {
display: flex;
gap: 24px;
font-family: var(–font-mono);
font-size: 11px;
color: var(–muted);
}

.stat-val { color: var(–accent2); }

/* MAIN LAYOUT */
.app {
display: grid;
grid-template-columns: 300px 1fr;
height: calc(100vh - 73px);
}

/* SIDEBAR */
.sidebar {
border-right: 1px solid var(–border);
display: flex;
flex-direction: column;
overflow: hidden;
}

.sidebar-header {
padding: 16px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
background: var(–surface);
}

.sidebar-title {
font-family: var(–font-mono);
font-size: 11px;
letter-spacing: 3px;
color: var(–muted);
text-transform: uppercase;
}

.btn-new {
background: linear-gradient(135deg, var(–accent1), var(–accent3));
border: none;
color: #fff;
font-family: var(–font-mono);
font-size: 11px;
letter-spacing: 2px;
padding: 6px 12px;
cursor: pointer;
clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
transition: all 0.2s;
text-transform: uppercase;
}

.btn-new:hover {
transform: scale(1.05);
box-shadow: 0 0 20px rgba(255,45,120,0.5);
}

.project-list {
overflow-y: auto;
flex: 1;
padding: 8px;
}

.project-list::-webkit-scrollbar { width: 4px; }
.project-list::-webkit-scrollbar-track { background: transparent; }
.project-list::-webkit-scrollbar-thumb { background: var(–border); border-radius: 2px; }

.project-item {
padding: 12px 14px;
margin-bottom: 4px;
cursor: pointer;
border: 1px solid transparent;
border-radius: 2px;
transition: all 0.15s;
position: relative;
overflow: hidden;
}

.project-item:hover {
border-color: var(–border);
background: var(–surface);
}

.project-item.active {
border-color: var(–accent1);
background: rgba(255,45,120,0.08);
}

.project-item.active::before {
content: ‘’;
position: absolute;
left: 0; top: 0; bottom: 0;
width: 2px;
background: linear-gradient(to bottom, var(–accent1), var(–accent3));
}

.project-name {
font-family: var(–font-mono);
font-size: 13px;
color: var(–text);
margin-bottom: 4px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.project-meta {
display: flex;
justify-content: space-between;
align-items: center;
}

.status-badge {
font-family: var(–font-mono);
font-size: 9px;
letter-spacing: 1px;
padding: 2px 6px;
text-transform: uppercase;
}

.status-idea { background: rgba(255,238,0,0.15); color: var(–accent4); border: 1px solid rgba(255,238,0,0.3); }
.status-wip { background: rgba(0,245,255,0.1); color: var(–accent2); border: 1px solid rgba(0,245,255,0.3); }
.status-mix { background: rgba(176,38,255,0.1); color: var(–accent3); border: 1px solid rgba(176,38,255,0.3); }
.status-master { background: rgba(255,45,120,0.1); color: var(–accent1); border: 1px solid rgba(255,45,120,0.3); }
.status-done { background: rgba(0,255,100,0.1); color: #00ff64; border: 1px solid rgba(0,255,100,0.3); }

.project-ver {
font-family: var(–font-mono);
font-size: 10px;
color: var(–muted);
}

/* MAIN CONTENT */
.main {
display: flex;
flex-direction: column;
overflow: hidden;
}

.empty-state {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
color: var(–muted);
font-family: var(–font-mono);
text-align: center;
gap: 12px;
}

.empty-icon {
font-size: 48px;
opacity: 0.3;
animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
0%, 100% { opacity: 0.3; }
50% { opacity: 0.6; }
}

.empty-text { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }

/* PROJECT DETAIL */
.project-detail {
flex: 1;
display: flex;
flex-direction: column;
overflow: hidden;
}

.detail-header {
padding: 20px 28px;
border-bottom: 1px solid var(–border);
background: var(–surface);
display: flex;
align-items: flex-start;
justify-content: space-between;
gap: 16px;
}

.detail-title-row {
display: flex;
align-items: center;
gap: 12px;
margin-bottom: 8px;
}

.detail-title {
font-family: var(–font-mono);
font-size: 20px;
color: var(–text);
letter-spacing: 2px;
}

.detail-actions {
display: flex;
gap: 8px;
flex-shrink: 0;
}

.btn-action {
background: var(–surface2);
border: 1px solid var(–border);
color: var(–muted);
font-family: var(–font-mono);
font-size: 10px;
letter-spacing: 2px;
padding: 6px 12px;
cursor: pointer;
text-transform: uppercase;
transition: all 0.15s;
}

.btn-action:hover {
border-color: var(–accent2);
color: var(–accent2);
box-shadow: 0 0 10px rgba(0,245,255,0.2);
}

.btn-danger:hover {
border-color: var(–accent1);
color: var(–accent1);
box-shadow: 0 0 10px rgba(255,45,120,0.2);
}

.detail-info {
display: flex;
gap: 24px;
font-family: var(–font-mono);
font-size: 11px;
color: var(–muted);
flex-wrap: wrap;
}

.detail-info span { color: var(–text); }

/* STATUS SELECTOR */
.status-selector {
display: flex;
gap: 4px;
padding: 12px 28px;
border-bottom: 1px solid var(–border);
background: var(–surface2);
overflow-x: auto;
}

.status-selector::-webkit-scrollbar { display: none; }

.status-btn {
font-family: var(–font-mono);
font-size: 9px;
letter-spacing: 1px;
padding: 4px 10px;
border: none;
cursor: pointer;
text-transform: uppercase;
transition: all 0.15s;
white-space: nowrap;
background: transparent;
color: var(–muted);
border-bottom: 2px solid transparent;
}

.status-btn.active-idea { color: var(–accent4); border-bottom-color: var(–accent4); }
.status-btn.active-wip { color: var(–accent2); border-bottom-color: var(–accent2); }
.status-btn.active-mix { color: var(–accent3); border-bottom-color: var(–accent3); }
.status-btn.active-master { color: var(–accent1); border-bottom-color: var(–accent1); }
.status-btn.active-done { color: #00ff64; border-bottom-color: #00ff64; }

/* CONTENT AREA */
.content-area {
flex: 1;
overflow-y: auto;
padding: 24px 28px;
display: grid;
grid-template-columns: 1fr 1fr;
gap: 20px;
align-content: start;
}

.content-area::-webkit-scrollbar { width: 4px; }
.content-area::-webkit-scrollbar-thumb { background: var(–border); }

/* VERSION LOG */
.panel {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 2px;
overflow: hidden;
}

.panel.full-width { grid-column: 1 / -1; }

.panel-header {
padding: 10px 16px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
background: var(–surface2);
}

.panel-title {
font-family: var(–font-mono);
font-size: 10px;
letter-spacing: 3px;
color: var(–muted);
text-transform: uppercase;
}

.panel-body { padding: 16px; }

/* VERSION ITEMS */
.version-list { display: flex; flex-direction: column; gap: 8px; }

.version-item {
border: 1px solid var(–border);
padding: 12px 14px;
background: var(–surface2);
position: relative;
transition: border-color 0.15s;
}

.version-item:hover { border-color: var(–accent3); }

.version-item::before {
content: ‘’;
position: absolute;
left: 0; top: 0; bottom: 0;
width: 2px;
background: var(–accent3);
opacity: 0.5;
}

.version-top {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 6px;
}

.version-tag {
font-family: var(–font-mono);
font-size: 13px;
color: var(–accent3);
font-weight: bold;
}

.version-date {
font-family: var(–font-mono);
font-size: 10px;
color: var(–muted);
}

.version-note {
font-family: var(–font-mono);
font-size: 12px;
color: var(–text);
line-height: 1.5;
}

.version-delete {
background: none;
border: none;
color: var(–muted);
cursor: pointer;
font-size: 12px;
padding: 2px 6px;
transition: color 0.15s;
font-family: var(–font-mono);
}

.version-delete:hover { color: var(–accent1); }

/* ADD VERSION FORM */
.add-version-form {
display: flex;
flex-direction: column;
gap: 10px;
margin-top: 12px;
padding-top: 12px;
border-top: 1px solid var(–border);
}

.form-row { display: flex; gap: 8px; }

.input-field {
background: var(–surface2);
border: 1px solid var(–border);
color: var(–text);
font-family: var(–font-mono);
font-size: 12px;
padding: 8px 12px;
outline: none;
transition: border-color 0.15s;
width: 100%;
}

.input-field:focus {
border-color: var(–accent2);
box-shadow: 0 0 8px rgba(0,245,255,0.15);
}

.input-field::placeholder { color: var(–muted); }

.input-small { width: 90px; flex-shrink: 0; }

.btn-add {
background: linear-gradient(135deg, rgba(0,245,255,0.15), rgba(176,38,255,0.15));
border: 1px solid var(–accent2);
color: var(–accent2);
font-family: var(–font-mono);
font-size: 10px;
letter-spacing: 2px;
padding: 8px 16px;
cursor: pointer;
text-transform: uppercase;
transition: all 0.15s;
white-space: nowrap;
}

.btn-add:hover {
background: rgba(0,245,255,0.2);
box-shadow: 0 0 16px rgba(0,245,255,0.3);
}

/* NOTES */
.notes-textarea {
width: 100%;
background: var(–surface2);
border: 1px solid var(–border);
color: var(–text);
font-family: var(–font-mono);
font-size: 12px;
padding: 12px;
outline: none;
resize: none;
min-height: 140px;
line-height: 1.6;
transition: border-color 0.15s;
}

.notes-textarea:focus {
border-color: var(–accent3);
box-shadow: 0 0 8px rgba(176,38,255,0.15);
}

.notes-textarea::placeholder { color: var(–muted); }

/* TASKS */
.task-list { display: flex; flex-direction: column; gap: 6px; }

.task-item {
display: flex;
align-items: center;
gap: 10px;
padding: 8px 10px;
background: var(–surface2);
border: 1px solid var(–border);
transition: border-color 0.15s;
}

.task-item:hover { border-color: var(–border); }
.task-item.done { opacity: 0.5; }

.task-check {
width: 14px; height: 14px;
border: 1px solid var(–muted);
background: none;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
flex-shrink: 0;
transition: all 0.15s;
font-size: 10px;
color: transparent;
}

.task-item.done .task-check {
border-color: var(–accent2);
color: var(–accent2);
background: rgba(0,245,255,0.1);
}

.task-text {
font-family: var(–font-mono);
font-size: 12px;
color: var(–text);
flex: 1;
}

.task-item.done .task-text {
text-decoration: line-through;
color: var(–muted);
}

.task-delete {
background: none;
border: none;
color: var(–muted);
cursor: pointer;
font-family: var(–font-mono);
font-size: 11px;
padding: 2px 4px;
transition: color 0.15s;
}

.task-delete:hover { color: var(–accent1); }

.task-add-row {
display: flex;
gap: 8px;
margin-top: 10px;
}

/* MODAL */
.modal-overlay {
position: fixed;
inset: 0;
background: rgba(5,5,8,0.85);
backdrop-filter: blur(4px);
z-index: 2000;
display: flex;
align-items: center;
justify-content: center;
animation: fadein 0.15s ease;
}

@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.modal {
background: var(–surface);
border: 1px solid var(–accent1);
box-shadow: 0 0 60px rgba(255,45,120,0.2), 0 0 120px rgba(176,38,255,0.1);
padding: 28px;
width: 420px;
max-width: 90vw;
animation: slidein 0.2s ease;
position: relative;
}

@keyframes slidein { from { transform: translateY(-20px); opacity: 0; } to { transform: none; opacity: 1; } }

.modal::before {
content: ‘’;
position: absolute;
top: 0; left: 0; right: 0;
height: 2px;
background: linear-gradient(to right, var(–accent1), var(–accent3), var(–accent2));
}

.modal-title {
font-family: var(–font-mono);
font-size: 14px;
letter-spacing: 3px;
color: var(–accent1);
text-transform: uppercase;
margin-bottom: 20px;
}

.modal-fields { display: flex; flex-direction: column; gap: 12px; }

.field-label {
font-family: var(–font-mono);
font-size: 10px;
letter-spacing: 2px;
color: var(–muted);
text-transform: uppercase;
margin-bottom: 4px;
}

.select-field {
background: var(–surface2);
border: 1px solid var(–border);
color: var(–text);
font-family: var(–font-mono);
font-size: 12px;
padding: 8px 12px;
outline: none;
width: 100%;
cursor: pointer;
}

.select-field option { background: var(–surface2); }

.modal-actions {
display: flex;
justify-content: flex-end;
gap: 8px;
margin-top: 20px;
}

.btn-cancel {
background: none;
border: 1px solid var(–border);
color: var(–muted);
font-family: var(–font-mono);
font-size: 10px;
letter-spacing: 2px;
padding: 8px 16px;
cursor: pointer;
text-transform: uppercase;
transition: all 0.15s;
}

.btn-cancel:hover { border-color: var(–muted); color: var(–text); }

.btn-confirm {
background: linear-gradient(135deg, var(–accent1), var(–accent3));
border: none;
color: #fff;
font-family: var(–font-mono);
font-size: 10px;
letter-spacing: 2px;
padding: 8px 20px;
cursor: pointer;
text-transform: uppercase;
transition: all 0.2s;
}

.btn-confirm:hover {
box-shadow: 0 0 20px rgba(255,45,120,0.4);
transform: scale(1.02);
}

/* PROGRESS BAR */
.progress-bar {
height: 3px;
background: var(–border);
border-radius: 2px;
overflow: hidden;
margin-top: 8px;
}

.progress-fill {
height: 100%;
border-radius: 2px;
transition: width 0.5s ease;
}

/* BPM / KEY TAGS */
.meta-tags {
display: flex;
gap: 6px;
flex-wrap: wrap;
margin-top: 6px;
}

.meta-tag {
font-family: var(–font-mono);
font-size: 10px;
padding: 3px 8px;
border: 1px solid var(–border);
color: var(–muted);
background: var(–surface2);
}

.meta-tag.highlight {
border-color: var(–accent4);
color: var(–accent4);
background: rgba(255,238,0,0.05);
}

/* no projects state */
.no-projects {
padding: 40px 16px;
text-align: center;
font-family: var(–font-mono);
font-size: 11px;
color: var(–muted);
letter-spacing: 2px;
}
</style>

</head>
<body>

<header>
  <div class="logo">
    <span class="gl">GL1TCH</span><span class="rest">_N0TES</span>
  </div>
  <div class="header-stats">
    <div>PROJECTS: <span class="stat-val" id="stat-projects">0</span></div>
    <div>VERSIONS: <span class="stat-val" id="stat-versions">0</span></div>
    <div>TASKS: <span class="stat-val" id="stat-tasks">0</span></div>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">// tracks</div>
      <button class="btn-new" onclick="openNewProjectModal()">+ NEW</button>
    </div>
    <div class="project-list" id="project-list">
      <div class="no-projects">NO TRACKS YET<br>HIT + NEW</div>
    </div>
  </div>

  <!-- MAIN -->

  <div class="main" id="main-area">
    <div class="empty-state">
      <div class="empty-icon">◈</div>
      <div class="empty-text">select a track to view</div>
    </div>
  </div>
</div>

<!-- NEW PROJECT MODAL -->

<div class="modal-overlay" id="new-project-modal" style="display:none">
  <div class="modal">
    <div class="modal-title">// new track</div>
    <div class="modal-fields">
      <div>
        <div class="field-label">track name</div>
        <input type="text" class="input-field" id="new-name" placeholder="e.g. gl1tch_g1rl" maxlength="40">
      </div>
      <div>
        <div class="field-label">status</div>
        <select class="select-field" id="new-status">
          <option value="idea">IDEA</option>
          <option value="wip" selected>WIP</option>
          <option value="mix">MIX</option>
          <option value="master">MASTER</option>
          <option value="done">DONE</option>
        </select>
      </div>
      <!-- MP3解析 -->
      <div style="border:1px solid var(--border);padding:12px;background:var(--surface2)">
        <div class="field-label" style="margin-bottom:8px">🎵 MP3をドロップしてBPM・KEY解析</div>
        <div id="drop-zone" style="
          border: 2px dashed var(--accent3);
          padding: 20px;
          text-align: center;
          cursor: pointer;
          transition: all 0.2s;
          font-family: var(--font-mono);
          font-size: 11px;
          color: var(--muted);
          letter-spacing: 2px;
          position: relative;
        "
          ondragover="event.preventDefault(); this.style.borderColor='var(--accent2)'; this.style.background='rgba(0,245,255,0.05)'"
          ondragleave="this.style.borderColor='var(--accent3)'; this.style.background=''"
          ondrop="handleAudioDrop(event)"
          onclick="document.getElementById('audio-file-input').click()"
        >
          DROP MP3 / TAP TO SELECT
          <input type="file" id="audio-file-input" accept="audio/*" style="display:none" onchange="handleAudioFile(this.files[0])">
        </div>
        <div id="analyze-status" style="font-family:var(--font-mono);font-size:11px;color:var(--muted);min-height:16px;margin-top:8px"></div>
        <div id="analyze-progress" style="height:2px;background:var(--border);margin-top:6px;display:none">
          <div id="analyze-bar" style="height:100%;width:0%;background:linear-gradient(to right,var(--accent3),var(--accent2));transition:width 0.3s"></div>
        </div>
      </div>
      <!-- 曲名検索 -->
      <div style="border:1px solid var(--border);padding:12px;background:var(--surface2)">
        <div class="field-label" style="margin-bottom:8px">曲名からBPM・KEY検索</div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input type="text" class="input-field" id="ref-song" placeholder="曲名 アーティスト名" style="flex:1">
          <button class="btn-add" onclick="fetchBpmKey()" id="fetch-btn">検索</button>
        </div>
        <div id="fetch-status" style="font-family:var(--font-mono);font-size:11px;color:var(--muted);min-height:16px"></div>
      </div>
      <div style="display:flex;gap:10px">
        <div style="flex:1">
          <div class="field-label">BPM</div>
          <input type="number" class="input-field" id="new-bpm" placeholder="140" min="60" max="300">
        </div>
        <div style="flex:1">
          <div class="field-label">KEY</div>
          <input type="text" class="input-field" id="new-key" placeholder="F# min" maxlength="20">
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('new-project-modal')">CANCEL</button>
      <button class="btn-confirm" onclick="createProject()">CREATE</button>
    </div>
  </div>
</div>

<script>
// ===== GETSONGBPM API =====
const GSBPM_KEY = '80de2c8d64369d49872531ccb3046636';

async function fetchBpmKey() {
  const query = document.getElementById('ref-song').value.trim();
  if (!query) { document.getElementById('fetch-status').textContent = '曲名を入力してください'; return; }

  const btn = document.getElementById('fetch-btn');
  const status = document.getElementById('fetch-status');
  btn.textContent = '...';
  btn.disabled = true;
  status.style.color = 'var(--muted)';
  status.textContent = '検索中...';

  try {
    const res = await fetch(`https://api.getsong.co/search/?api_key=${GSBPM_KEY}&type=song&lookup=${encodeURIComponent(query)}`);
    const data = await res.json();

    if (!data.search || data.search.length === 0) {
      status.style.color = 'var(--accent1)';
      status.textContent = '曲が見つかりませんでした';
      return;
    }

    const song = data.search[0];
    const bpm = song.tempo;
    const key = song.key_of || null;

    if (bpm) document.getElementById('new-bpm').value = Math.round(bpm);
    if (key) document.getElementById('new-key').value = key;

    status.style.color = 'var(--accent2)';
    status.textContent = `✓ ${song.title} / ${song.artist?.name || ''} → BPM:${Math.round(bpm)||'?'} KEY:${key||'?'}`;
  } catch(e) {
    status.style.color = 'var(--accent1)';
    status.textContent = 'エラーが発生しました';
  } finally {
    btn.textContent = '検索';
    btn.disabled = false;
  }
}

// ===== DATA =====
const STORE_KEY = 'glitch_notes_v1';

function load() {
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY)) || { projects: [] };
  } catch { return { projects: [] }; }
}

function save(data) {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

let state = load();
let selectedId = null;

// ===== UTILS =====
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function today() {
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function statusLabel(s) {
  return { idea:'IDEA', wip:'WIP', mix:'MIX', master:'MASTER', done:'DONE' }[s] || s;
}

function statusProgress(s) {
  return { idea:10, wip:35, mix:60, master:85, done:100 }[s] || 0;
}

function progressColor(s) {
  return { idea:'#ffee00', wip:'#00f5ff', mix:'#b026ff', master:'#ff2d78', done:'#00ff64' }[s] || '#ffffff';
}

// ===== RENDER =====
function renderAll() {
  renderSidebar();
  renderStats();
  if (selectedId) {
    const p = state.projects.find(x => x.id === selectedId);
    if (p) renderDetail(p); else renderEmpty();
  }
}

function renderStats() {
  document.getElementById('stat-projects').textContent = state.projects.length;
  const totalVer = state.projects.reduce((a,p) => a + p.versions.length, 0);
  const totalTask = state.projects.reduce((a,p) => a + p.tasks.length, 0);
  document.getElementById('stat-versions').textContent = totalVer;
  document.getElementById('stat-tasks').textContent = totalTask;
}

function renderSidebar() {
  const el = document.getElementById('project-list');
  if (state.projects.length === 0) {
    el.innerHTML = '<div class="no-projects">NO TRACKS YET<br>HIT + NEW</div>';
    return;
  }
  el.innerHTML = state.projects.map(p => `
    <div class="project-item ${p.id === selectedId ? 'active' : ''}" onclick="selectProject('${p.id}')">
      <div class="project-name">${escHtml(p.name)}</div>
      <div class="project-meta">
        <span class="status-badge status-${p.status}">${statusLabel(p.status)}</span>
        <span class="project-ver">v${p.versions.length}</span>
      </div>
      <div class="progress-bar" style="margin-top:8px">
        <div class="progress-fill" style="width:${statusProgress(p.status)}%;background:${progressColor(p.status)}"></div>
      </div>
    </div>
  `).join('');
}

function renderEmpty() {
  document.getElementById('main-area').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">◈</div>
      <div class="empty-text">select a track to view</div>
    </div>`;
}

function renderDetail(p) {
  const doneTasks = p.tasks.filter(t => t.done).length;
  const html = `
    <div class="project-detail">
      <div class="detail-header">
        <div>
          <div class="detail-title-row">
            <div class="detail-title">${escHtml(p.name)}</div>
            <span class="status-badge status-${p.status}">${statusLabel(p.status)}</span>
          </div>
          <div class="detail-info">
            <div>CREATED <span>${escHtml(p.created)}</span></div>
            <div>VERSIONS <span>${p.versions.length}</span></div>
            <div>TASKS <span>${doneTasks}/${p.tasks.length}</span></div>
            ${p.bpm ? `<div>BPM <span>${escHtml(p.bpm)}</span></div>` : ''}
            ${p.key ? `<div>KEY <span>${escHtml(p.key)}</span></div>` : ''}
          </div>
        </div>
        <div class="detail-actions">
          <button class="btn-action btn-danger" onclick="deleteProject('${p.id}')">DELETE</button>
        </div>
      </div>

      <div class="status-selector">
        ${['idea','wip','mix','master','done'].map(s => `
          <button class="status-btn ${p.status===s?'active-'+s:''}" onclick="changeStatus('${p.id}','${s}')">
            ${statusLabel(s)}
          </button>
        `).join('')}
      </div>

      <div class="content-area">

        <!-- VERSION LOG -->
        <div class="panel full-width">
          <div class="panel-header">
            <div class="panel-title">// version log</div>
          </div>
          <div class="panel-body">
            <div class="version-list" id="ver-list-${p.id}">
              ${p.versions.length === 0
                ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:2px">NO VERSIONS YET</div>`
                : [...p.versions].reverse().map(v => `
                  <div class="version-item">
                    <div class="version-top">
                      <span class="version-tag">${escHtml(v.tag)}</span>
                      <div style="display:flex;align-items:center;gap:8px">
                        <span class="version-date">${escHtml(v.date)}</span>
                        <button class="version-delete" onclick="deleteVersion('${p.id}','${v.id}')">✕</button>
                      </div>
                    </div>
                    <div class="version-note">${escHtml(v.note)}</div>
                  </div>
                `).join('')
              }
            </div>
            <div class="add-version-form">
              <div class="form-row">
                <input type="text" class="input-field input-small" id="ver-tag-${p.id}" placeholder="v4" maxlength="10">
                <input type="text" class="input-field" id="ver-note-${p.id}" placeholder="何を変えた？ e.g. ドラム差し替え、BPM128→132" maxlength="200">
                <button class="btn-add" onclick="addVersion('${p.id}')">+ ADD</button>
              </div>
            </div>
          </div>
        </div>

        <!-- NOTES -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">// free notes</div>
          </div>
          <div class="panel-body">
            <textarea class="notes-textarea" id="notes-${p.id}" placeholder="参考曲、プラグイン設定、アイデアなど..."
              oninput="saveNotes('${p.id}', this.value)">${escHtml(p.notes || '')}</textarea>

```
      </div>
    </div>

    <!-- TASKS -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">// todo list</div>
      </div>
      <div class="panel-body">
        <div class="task-list" id="task-list-${p.id}">
          ${p.tasks.length === 0
            ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">NO TASKS</div>`
            : p.tasks.map(t => `
              <div class="task-item ${t.done ? 'done' : ''}" id="task-${t.id}">
                <div class="task-check" onclick="toggleTask('${p.id}','${t.id}')">${t.done ? '✓' : ''}</div>
                <div class="task-text">${escHtml(t.text)}</div>
                <button class="task-delete" onclick="deleteTask('${p.id}','${t.id}')">✕</button>
              </div>
            `).join('')
          }
        </div>
        <div class="task-add-row">
          <input type="text" class="input-field" id="task-input-${p.id}" placeholder="e.g. ボーカル録音、リバーブ調整..." maxlength="80"
            onkeydown="if(event.key==='Enter') addTask('${p.id}')">
          <button class="btn-add" onclick="addTask('${p.id}')">+ ADD</button>
        </div>
      </div>
    </div>

  </div>
</div>
```

`;
document.getElementById(‘main-area’).innerHTML = html;
}

// ===== ACTIONS =====
function selectProject(id) {
selectedId = id;
const p = state.projects.find(x => x.id === id);
renderSidebar();
renderDetail(p);
}

function openNewProjectModal() {
document.getElementById(‘new-name’).value = ‘’;
document.getElementById(‘new-bpm’).value = ‘’;
document.getElementById(‘new-key’).value = ‘’;
document.getElementById(‘new-project-modal’).style.display = ‘flex’;
setTimeout(() => document.getElementById(‘new-name’).focus(), 100);
}

function closeModal(id) {
document.getElementById(id).style.display = ‘none’;
}

function createProject() {
const name = document.getElementById(‘new-name’).value.trim();
if (!name) { document.getElementById(‘new-name’).focus(); return; }
const p = {
id: uid(),
name,
status: document.getElementById(‘new-status’).value,
bpm: document.getElementById(‘new-bpm’).value.trim(),
key: document.getElementById(‘new-key’).value.trim(),
created: today(),
versions: [],
tasks: [],
notes: ‘’
};
state.projects.unshift(p);
save(state);
closeModal(‘new-project-modal’);
selectedId = p.id;
renderAll();
}

function deleteProject(id) {
if (!confirm(‘このトラックを削除しますか？’)) return;
state.projects = state.projects.filter(p => p.id !== id);
if (selectedId === id) { selectedId = null; }
save(state);
renderAll();
if (!selectedId) renderEmpty();
}

function changeStatus(id, status) {
const p = state.projects.find(x => x.id === id);
if (!p) return;
p.status = status;
save(state);
renderAll();
}

function addVersion(pid) {
const p = state.projects.find(x => x.id === pid);
if (!p) return;
const tag = document.getElementById(`ver-tag-${pid}`).value.trim() || `v${p.versions.length + 1}`;
const note = document.getElementById(`ver-note-${pid}`).value.trim();
if (!note) { document.getElementById(`ver-note-${pid}`).focus(); return; }
p.versions.push({ id: uid(), tag, note, date: today() });
save(state);
renderAll();
}

function deleteVersion(pid, vid) {
const p = state.projects.find(x => x.id === pid);
if (!p) return;
p.versions = p.versions.filter(v => v.id !== vid);
save(state);
renderAll();
}

function saveNotes(pid, val) {
const p = state.projects.find(x => x.id === pid);
if (!p) return;
p.notes = val;
save(state);
renderStats();
}

function addTask(pid) {
const p = state.projects.find(x => x.id === pid);
if (!p) return;
const text = document.getElementById(`task-input-${pid}`).value.trim();
if (!text) return;
p.tasks.push({ id: uid(), text, done: false });
save(state);
renderAll();
}

function toggleTask(pid, tid) {
const p = state.projects.find(x => x.id === pid);
if (!p) return;
const t = p.tasks.find(x => x.id === tid);
if (!t) return;
t.done = !t.done;
save(state);
renderAll();
}

function deleteTask(pid, tid) {
const p = state.projects.find(x => x.id === pid);
if (!p) return;
p.tasks = p.tasks.filter(t => t.id !== tid);
save(state);
renderAll();
}

function escHtml(s) {
if (!s) return ‘’;
return String(s).replace(/&/g,’&’).replace(/</g,’<’).replace(/>/g,’>’).replace(/”/g,’"’);
}

// keyboard shortcut
document.addEventListener(‘keydown’, e => {
if (e.key === ‘Escape’) {
document.querySelectorAll(’.modal-overlay’).forEach(m => m.style.display = ‘none’);
}
});

// click outside modal to close
document.getElementById(‘new-project-modal’).addEventListener(‘click’, function(e) {
if (e.target === this) closeModal(‘new-project-modal’);
});

// init
renderAll();
</script>

</body>
</html>
