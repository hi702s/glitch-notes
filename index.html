<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTIFY_STATS // your music dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060608;
  --surface: #0e0e14;
  --surface2: #141420;
  --border: #1e1e30;
  --spotify: #1DB954;
  --spotify-dim: rgba(29,185,84,0.15);
  --blue: #1E90FF;
  --blue-dim: rgba(30,144,255,0.15);
  --cyan: #00f0ff;
  --text: #e8f0e8;
  --muted: #556655;
  --font-mono: 'Share Tech Mono', monospace;
  --font-main: 'Syne', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-main);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content:'';
  position:fixed;
  inset:0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
  pointer-events:none;
  z-index:1000;
}

/* BG glow */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 600px 400px at 10% 20%, rgba(29,185,84,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 500px 500px at 90% 80%, rgba(30,144,255,0.04) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}

/* ===== LOGIN SCREEN ===== */
#login-screen {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:500;
  background: var(--bg);
  gap:32px;
}

.login-logo {
  font-family: var(--font-mono);
  font-size:28px;
  letter-spacing:6px;
  text-align:center;
}

.login-logo .sp { color: var(--spotify); text-shadow: 0 0 30px var(--spotify); }
.login-logo .bl { color: var(--blue); text-shadow: 0 0 30px var(--blue); }

.login-subtitle {
  font-family: var(--font-mono);
  font-size:11px;
  letter-spacing:4px;
  color: var(--muted);
  text-align:center;
  text-transform:uppercase;
}

.login-btn {
  display:flex;
  align-items:center;
  gap:12px;
  background: var(--spotify);
  color: #000;
  font-family: var(--font-mono);
  font-size:13px;
  letter-spacing:3px;
  padding:14px 32px;
  border:none;
  cursor:pointer;
  text-transform:uppercase;
  font-weight:bold;
  transition: all 0.2s;
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
}

.login-btn:hover {
  transform:scale(1.05);
  box-shadow: 0 0 40px rgba(29,185,84,0.5);
}

.login-btn svg { width:20px; height:20px; }

.login-note {
  font-family: var(--font-mono);
  font-size:10px;
  color: var(--muted);
  letter-spacing:2px;
  text-align:center;
  line-height:1.8;
}

/* ===== MAIN DASHBOARD ===== */
#dashboard {
  display:none;
  flex-direction:column;
  min-height:100vh;
  position:relative;
  z-index:1;
}

/* HEADER */
header {
  padding:20px 28px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  background: rgba(14,14,20,0.8);
  backdrop-filter: blur(10px);
  position:sticky;
  top:0;
  z-index:100;
}

.logo {
  font-family: var(--font-mono);
  font-size:18px;
  letter-spacing:4px;
}

.logo .sp { color: var(--spotify); text-shadow: 0 0 15px var(--spotify); }
.logo .bl { color: var(--blue); text-shadow: 0 0 15px var(--blue); }

.header-right {
  display:flex;
  align-items:center;
  gap:16px;
}

.user-info {
  display:flex;
  align-items:center;
  gap:10px;
}

.user-avatar {
  width:32px; height:32px;
  border-radius:50%;
  border:2px solid var(--spotify);
  object-fit:cover;
  background: var(--surface2);
}

.user-name {
  font-family: var(--font-mono);
  font-size:12px;
  color: var(--spotify);
}

.btn-logout {

  font-size:10px;
  letter-spacing:2px;
  color: var(--muted);
  background: none;
  border:1px solid var(--border);
  padding:5px 10px;
  cursor:pointer;
  text-transform:uppercase;
  transition:all 0.15s;
}

.btn-logout:hover { border-color: var(--muted); color: var(--text); }

/* NOW PLAYING BANNER */

  background: linear-gradient(135deg, rgba(29,185,84,0.08), rgba(30,144,255,0.08));
  border-bottom:1px solid var(--border);
  display:none;
  align-items:center;
  gap:16px;
}

.np-label {
  font-family: var(--font-mono);
  font-size:9px;
  letter-spacing:3px;
  color: var(--spotify);
  text-transform:uppercase;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:6px;
}

.np-dot {

  border-radius:50%;
  background: var(--spotify);
  animation: blink 1.5s ease-in-out infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.np-cover {

  border:1px solid var(--spotify);
  flex-shrink:0;
}

.np-info { flex:1; min-width:0; }

.np-title {

  font-size:13px;
  color: var(--text);
  white-space:nowrap;

}

.np-artist {

}

.np-progress-wrap {

}

.np-progress {

.np-progress-fill {

.artist-img {

  font-size:12px;

  text-overflow:ellipsis;

/* TIME FILTER */

<script>
// ===== SPOTIFY CONFIG =====
// ★ ここにあなたのClient IDを入れてください
const CLIENT_ID = 'd14CEF2350bd4892A1050006052d9e55';
const REDIRECT_URI = 'https://hi702s.github.io/glitch-notes';
const SCOPES = [
  'user-read-recently-played',
  'user-top-read',
  'user-read-currently-playing',
  'user-read-playback-state',
  'user-read-private'
].join(' ');

// ===== PKCE AUTH =====
function base64URLEncode(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function generateCodeVerifier() {
  const array = new Uint8Array(32);
  crypto.getRandomValues(array);
  return base64URLEncode(array);
}

async function generateCodeChallenge(verifier) {
  const encoder = new TextEncoder();
  const data = encoder.encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return base64URLEncode(digest);
}

async function loginSpotify() {
  const verifier = await generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  sessionStorage.setItem('pkce_verifier', verifier);

  const params = new URLSearchParams({
    response_type: 'code',
    client_id: CLIENT_ID,
    scope: SCOPES,
    redirect_uri: REDIRECT_URI,
    code_challenge_method: 'S256',
    code_challenge: challenge,
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params;
}

async function exchangeCode(code) {
  const verifier = sessionStorage.getItem('pkce_verifier');
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT_URI,
      client_id: CLIENT_ID,
      code_verifier: verifier,
    })
  });
  const data = await res.json();
  if (data.access_token) {
    localStorage.setItem('spotify_token', data.access_token);
    localStorage.setItem('spotify_expiry', Date.now() + data.expires_in * 1000);
    if (data.refresh_token) localStorage.setItem('spotify_refresh', data.refresh_token);
    sessionStorage.removeItem('pkce_verifier');
    window.history.replaceState({}, '', window.location.pathname);
    return data.access_token;
  }
  return null;
}

async function refreshToken() {
  const refresh = localStorage.getItem('spotify_refresh');
  if (!refresh) return null;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: refresh,
      client_id: CLIENT_ID,
    })
  });
  const data = await res.json();
  if (data.access_token) {
    localStorage.setItem('spotify_token', data.access_token);
    localStorage.setItem('spotify_expiry', Date.now() + data.expires_in * 1000);
    return data.access_token;
  }
  return null;
}

async function getToken() {
  // 認証コードがURLにある場合
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  if (code) {
    const token = await exchangeCode(code);
    if (token) return token;
  }

  // 有効なトークンがある場合
  const token = localStorage.getItem('spotify_token');
  const expiry = localStorage.getItem('spotify_expiry');
  if (token && expiry && Date.now() < parseInt(expiry) - 60000) return token;

  // リフレッシュ
  return await refreshToken();
}

function logout() {
  localStorage.removeItem('spotify_token');
  localStorage.removeItem('spotify_expiry');
  window.location.reload();
}

// ===== API =====
async function spotifyFetch(endpoint) {
  const token = await getToken();
  if (!token) throw new Error('no token');
  const res = await fetch('https://api.spotify.com/v1' + endpoint, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

// ===== INIT =====
let currentTimeRange = 'short_term';
let npInterval = null;

async function init() {
  const token = await getToken();
  if (!token) {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    return;
  }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'flex';

  await Promise.all([
    loadUser(),
    loadRecentTracks(),
    loadTopArtists(),
    loadNowPlaying()
  ]);

  npInterval = setInterval(loadNowPlaying, 30000);
}

async function loadUser() {
  try {
    const user = await spotifyFetch('/me');
    document.getElementById('user-name').textContent = user.display_name || user.id;
    if (user.images && user.images[0]) {
      document.getElementById('user-avatar').src = user.images[0].url;
    }
  } catch(e) { console.error('user load failed', e); }
}

async function loadNowPlaying() {
  try {
    const data = await spotifyFetch('/me/player/currently-playing');
    if (!data || !data.item) {
      document.getElementById('now-playing-bar').style.display = 'none';
      return;
    }
    const bar = document.getElementById('now-playing-bar');
    bar.style.display = 'flex';
    document.getElementById('np-title').textContent = data.item.name;
    document.getElementById('np-artist').textContent = data.item.artists.map(a=>a.name).join(', ');
    if (data.item.album.images[0]) {
      document.getElementById('np-cover').src = data.item.album.images[0].url;
    }
    const pct = (data.progress_ms / data.item.duration_ms) * 100;
    document.getElementById('np-progress').style.width = pct + '%';
    document.getElementById('np-current').textContent = formatMs(data.progress_ms);
    document.getElementById('np-total').textContent = formatMs(data.item.duration_ms);
  } catch(e) {
    document.getElementById('now-playing-bar').style.display = 'none';
  }
}

async function loadRecentTracks() {
  const listEl = document.getElementById('track-list');
  listEl.innerHTML = '<div class="loading">// LOADING TRACKS...</div>';
  try {
    const [recentData, topData] = await Promise.all([
      spotifyFetch('/me/player/recently-played?limit=20'),
      spotifyFetch(`/me/top/tracks?limit=20&time_range=${currentTimeRange}`)
    ]);

    const tracks = currentTimeRange === 'short_term' && recentData.items
      ? recentData.items.map(i => ({ track: i.track, played_at: i.played_at }))
      : topData.items.map(t => ({ track: t, played_at: null }));

    // アーティストIDを収集してジャンル取得
    const artistIds = [...new Set(tracks.flatMap(i => i.track.artists.map(a=>a.id)))].slice(0,10);
    let genreMap = {};
    if (artistIds.length > 0) {
      try {
        const artistData = await spotifyFetch('/artists?ids=' + artistIds.join(','));
        artistData.artists.forEach(a => {
          genreMap[a.id] = a.genres.slice(0,2);
        });
      } catch(e) {}
    }

    // ジャンル集計
    const genreCount = {};
    tracks.forEach(item => {
      item.track.artists.forEach(a => {
        (genreMap[a.id] || []).forEach(g => {
          genreCount[g] = (genreCount[g] || 0) + 1;
        });
      });
    });

    renderTracks(tracks, genreMap);
    renderGenres(genreCount);
    renderStats(tracks);
  } catch(e) {
    listEl.innerHTML = '<div class="error-msg">// ERROR: ' + e.message + '</div>';
  }
}

function renderTracks(tracks, genreMap) {
  const listEl = document.getElementById('track-list');
  if (!tracks.length) { listEl.innerHTML = '<div class="loading">// NO TRACKS</div>'; return; }

  listEl.innerHTML = tracks.map((item, i) => {
    const t = item.track;
    const cover = t.album.images[1]?.url || t.album.images[0]?.url || '';
    const duration = formatMs(t.duration_ms);
    const genres = t.artists.flatMap(a => genreMap[a.id] || []).slice(0,1);
    const timeAgo = item.played_at ? relativeTime(item.played_at) : '';

    return `
      <div class="track-item" style="animation-delay:${i*0.04}s">
        <div class="track-num">${i+1}</div>
        <img class="track-cover" src="${cover}" alt="" loading="lazy">
        <div class="track-info">
          <div class="track-name">${escHtml(t.name)}</div>
          <div class="track-meta">
            <span class="track-artist">${escHtml(t.artists.map(a=>a.name).join(', '))}</span>
            ${genres.length ? `<span class="genre-tag">${escHtml(genres[0])}</span>` : ''}
          </div>
        </div>
        <div class="track-time">${timeAgo || duration}</div>
      </div>
    `;
  }).join('');
}

function renderGenres(genreCount) {
  const el = document.getElementById('genre-chart');
  const sorted = Object.entries(genreCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if (!sorted.length) { el.innerHTML = '<div class="loading">// NO DATA</div>'; return; }
  const max = sorted[0][1];
  const colors = [
    'linear-gradient(to right, var(--spotify), var(--cyan))',
    'linear-gradient(to right, var(--blue), var(--cyan))',
    'linear-gradient(to right, var(--spotify), var(--blue))',
    'linear-gradient(to right, #00c896, var(--spotify))',
    'linear-gradient(to right, var(--blue), #7b4fff)',
    'linear-gradient(to right, var(--cyan), var(--blue))',
  ];
  el.innerHTML = sorted.map(([genre, count], i) => {
    const pct = Math.round((count / max) * 100);
    return `
      <div class="genre-row">
        <div class="genre-name">${escHtml(genre)}</div>
        <div class="genre-bar-wrap">
          <div class="genre-bar" style="width:${pct}%;background:${colors[i%colors.length]}"></div>
        </div>
        <div class="genre-pct">${pct}%</div>
      </div>
    `;
  }).join('');
}

function renderStats(tracks) {
  const el = document.getElementById('stats-grid');
  const uniqueArtists = new Set(tracks.flatMap(i=>i.track.artists.map(a=>a.id))).size;
  const uniqueAlbums = new Set(tracks.map(i=>i.track.album.id)).size;
  const totalMs = tracks.reduce((s,i)=>s+i.track.duration_ms, 0);
  const hours = Math.round(totalMs / 3600000 * 10) / 10;

  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-val">${tracks.length}</div>
      <div class="stat-label">TRACKS</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${uniqueArtists}</div>
      <div class="stat-label">ARTISTS</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${uniqueAlbums}</div>
      <div class="stat-label">ALBUMS</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${hours}h</div>
      <div class="stat-label">TOTAL</div>
    </div>
  `;
}

async function loadTopArtists() {
  const el = document.getElementById('artist-list');
  try {
    const data = await spotifyFetch(`/me/top/artists?limit=5&time_range=${currentTimeRange}`);
    if (!data.items.length) { el.innerHTML = '<div class="loading">// NO DATA</div>'; return; }
    el.innerHTML = data.items.map((a, i) => {
      const img = a.images[2]?.url || a.images[0]?.url || '';
      const genre = a.genres[0] || '';
      return `
        <div class="artist-item">
          <div class="artist-rank">${i+1}</div>
          <img class="artist-img" src="${img}" alt="" loading="lazy">
          <div class="artist-info">
            <div class="artist-name">${escHtml(a.name)}</div>
            <div class="artist-genre">${escHtml(genre)}</div>
          </div>
        </div>
      `;
    }).join('');
  } catch(e) {
    el.innerHTML = '<div class="error-msg">// ERROR</div>';
  }
}

async function setTimeRange(range, btn) {
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTimeRange = range;
  await Promise.all([loadRecentTracks(), loadTopArtists()]);
}

// ===== UTILS =====
function formatMs(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function relativeTime(isoStr) {
  const diff = Date.now() - new Date(isoStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== START =====
init();
</script>
</body>
</html>
