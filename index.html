<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOTIFY STATS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1c1c1c;
  --surface3: #242424;
  --border: #2a2a2a;
  --spotify: #1DB954;
  --blue: #2D8EFF;
  --cyan: #00C8FF;
  --text: #ffffff;
  --text2: #b3b3b3;
  --text3: #6a6a6a;
  --font: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== LOGIN ===== */
#login-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--bg); z-index: 500; gap: 28px;
}

.login-logo { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
.login-logo .sp { color: var(--spotify); }
.login-logo .bl { color: var(--blue); }
.login-sub { font-size: 14px; color: var(--text3); }

.login-btn {
  display: flex; align-items: center; gap: 10px;
  background: var(--spotify); color: #000;
  font-family: var(--font); font-size: 14px; font-weight: 700;
  padding: 14px 36px; border: none; border-radius: 500px;
  cursor: pointer; transition: all 0.2s;
}
.login-btn:hover { transform: scale(1.04); background: #1ed760; }
.login-btn svg { width: 20px; height: 20px; }

/* ===== DASHBOARD ===== */
#dashboard { display: none; flex-direction: column; min-height: 100vh; }

header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}

.logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
.logo .sp { color: var(--spotify); }
.logo .bl { color: var(--blue); }

.header-right { display: flex; align-items: center; gap: 14px; }

.user-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 500px; padding: 5px 14px 5px 5px;
}
.user-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--surface3); }
.user-name { font-size: 13px; font-weight: 500; color: var(--text2); }

.btn-logout {
  font-family: var(--font); font-size: 12px; font-weight: 500;
  color: var(--text3); background: none;
  border: 1px solid var(--border); border-radius: 500px;
  padding: 6px 14px; cursor: pointer; transition: all 0.15s;
}
.btn-logout:hover { color: var(--text); border-color: var(--text3); }

/* NOW PLAYING */
#now-playing-bar {
  background: linear-gradient(135deg, rgba(29,185,84,0.1), rgba(45,142,255,0.1));
  border-bottom: 1px solid var(--border);
  padding: 12px 32px; display: none;
  align-items: center; gap: 16px;
}

.np-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--spotify); white-space: nowrap;
}
.np-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--spotify); animation: blink 1.5s ease infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.np-cover { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
.np-info { flex: 1; min-width: 0; }
.np-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-artist { font-size: 12px; color: var(--text2); }
.np-progress-wrap { flex: 1; max-width: 240px; }
.np-progress { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
.np-progress-fill { height: 100%; background: linear-gradient(to right, var(--spotify), var(--cyan)); border-radius: 2px; transition: width 1s linear; }
.np-time { display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); font-family: var(--font-mono); }

/* MAIN */
.main-content { padding: 32px; display: flex; flex-direction: column; gap: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }

.time-range-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }

.time-tabs { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 500px; padding: 3px; gap: 2px; }
.time-tab { font-family: var(--font); font-size: 12px; font-weight: 600; padding: 6px 16px; border: none; border-radius: 500px; background: none; color: var(--text3); cursor: pointer; transition: all 0.2s; }
.time-tab.active { background: var(--spotify); color: #000; }

/* STATS */
.stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.stat-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
.stat-val { font-size: 28px; font-weight: 700; letter-spacing: -1px; background: linear-gradient(135deg, var(--spotify), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* GRID */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-main { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }

/* CARD */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.card-header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 14px; font-weight: 700; }
.card-badge { font-size: 10px; font-weight: 600; color: var(--spotify); background: rgba(29,185,84,0.12); padding: 3px 10px; border-radius: 500px; }
.card-body { padding: 16px 20px; }

/* RANK TABS */
.rank-tabs-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.rank-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface2); }
.rank-tab { flex: 1; font-family: var(--font); font-size: 12px; font-weight: 600; padding: 13px 8px; border: none; background: none; color: var(--text3); cursor: pointer; transition: all 0.15s; border-bottom: 2px solid transparent; text-align: center; }
.rank-tab.active { color: var(--spotify); border-bottom-color: var(--spotify); background: rgba(29,185,84,0.05); }
.rank-content { display: none; padding: 10px 14px; max-height: 520px; overflow-y: auto; }
.rank-content::-webkit-scrollbar { width: 4px; }
.rank-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.rank-content.active { display: block; }

/* RANK ITEM */
.rank-item { display: flex; align-items: center; gap: 12px; padding: 9px 6px; border-radius: 8px; transition: background 0.15s; animation: fadeUp 0.3s ease both; }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.rank-item:hover { background: var(--surface2); }
.rank-num { font-family: var(--font-mono); font-size: 12px; color: var(--text3); width: 18px; text-align: center; flex-shrink: 0; }
.rank-num.top3 { color: var(--spotify); font-weight: 700; }
.rank-img { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; background: var(--surface3); flex-shrink: 0; }
.rank-img.circle { border-radius: 50%; }
.rank-info { flex: 1; min-width: 0; }
.rank-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.rank-sub { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-tag { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 500px; background: rgba(45,142,255,0.12); color: var(--blue); white-space: nowrap; flex-shrink: 0; }

/* GENRE BARS */
.genre-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.genre-name { font-size: 11px; font-weight: 500; color: var(--text2); width: 90px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.genre-bar-wrap { flex: 1; height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
.genre-bar { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(0.4,0,0.2,1); }
.genre-pct { font-family: var(--font-mono); font-size: 11px; color: var(--text3); width: 30px; text-align: right; flex-shrink: 0; }

/* PIE */
.pie-wrap { display: flex; gap: 16px; align-items: center; }
.pie-legend { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.pie-legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text2); }
.pie-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* TRACK */
.track-item { display: grid; grid-template-columns: 20px 42px 1fr auto; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 8px; transition: background 0.15s; animation: fadeUp 0.3s ease both; }
.track-item:hover { background: var(--surface2); }
.track-num { font-family: var(--font-mono); font-size: 11px; color: var(--text3); text-align: center; }
.track-cover { width: 42px; height: 42px; border-radius: 4px; object-fit: cover; background: var(--surface3); }
.track-info { min-width: 0; }
.track-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.track-artist { font-size: 11px; color: var(--text2); }
.track-time { font-family: var(--font-mono); font-size: 11px; color: var(--text3); }

/* CHART */
.chart-wrap { position: relative; height: 170px; }
canvas { width: 100% !important; }

.chart-type-btns { display: flex; gap: 4px; }
.ct-btn { font-family: var(--font); font-size: 11px; font-weight: 600; padding: 4px 12px; border: 1px solid var(--border); border-radius: 500px; background: none; color: var(--text3); cursor: pointer; transition: all 0.15s; }
.ct-btn.active { background: var(--surface2); color: var(--text); border-color: var(--text3); }

.loading { padding: 24px; text-align: center; font-size: 12px; color: var(--text3); }
.error-msg { padding: 16px; text-align: center; font-size: 12px; color: #ff4466; }

@media(max-width:768px){
  .main-content{padding:16px;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .grid-2,.grid-main{grid-template-columns:1fr;}
  header{padding:0 16px;}
  #now-playing-bar{padding:10px 16px;}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-logo"><span class="sp">SPOTIFY</span><span class="bl">_STATS</span></div>
  <div class="login-sub">あなたの音楽をデータで見る</div>
  <button class="login-btn" onclick="loginSpotify()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
    Spotifyでログイン
  </button>
</div>

<div id="dashboard">
  <header>

<script>
const CLIENT_ID = 'd14CEF2350bd4892A1050006052d9e55';
const REDIRECT_URI = 'https://hi702s.github.io/glitch-notes';
const SCOPES = ['user-read-recently-played','user-top-read','user-read-currently-playing','user-read-playback-state','user-read-private'].join(' ');
const COLORS = ['#1DB954','#2D8EFF','#00C8FF','#FF6B6B','#FFD93D','#6BCB77','#845EC2','#FF9671','#00C9A7','#F9F871'];

// ===== SUPABASE =====
const SB_URL = 'https://kzhhxdockwwwhsffdifm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6aGh4ZG9ja3d3d2hzZmZkaWZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzI1NDAsImV4cCI6MjA5NDYwODU0MH0.qlmtD7k3dX22gu1DUBjKnrzQZHIverLDebEYQqS_UXk';

async function sbFetch(path, options={}) {
  const res = await fetch(SB_URL + '/rest/v1' + path, {
    ...options,
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal',
      ...(options.headers||{})
    }
  });
  if (res.status === 204 || res.status === 201) return null;
  if (!res.ok) { console.error('Supabase error:', res.status); return null; }
  return res.json();
}

async function savePlayHistory(items) {
  if (!items || items.length === 0) return;
  const rows = items.map(item => ({
    track_id: item.track.id,
    track_name: item.track.name,
    artist_name: item.track.artists.map(a=>a.name).join(', '),
    album_name: item.track.album?.name || '',
    played_at: item.played_at,
    duration_ms: String(item.track.duration_ms)
  }));

  const res = await fetch(SB_URL + '/rest/v1/play_history', {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=ignore-duplicates,return=minimal'
    },
    body: JSON.stringify(rows)
  });
  if (!res.ok) console.error('Supabase save error:', res.status);
}

async function getPlayHistory() {
  const data = await sbFetch('/play_history?select=*&order=played_at.desc&limit=1000');
  return data || [];
}

function b64url(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }

async function loginSpotify() {
  const v = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const c = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  sessionStorage.setItem('pkce_v', v);
  window.location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ response_type:'code', client_id:CLIENT_ID, scope:SCOPES, redirect_uri:REDIRECT_URI, code_challenge_method:'S256', code_challenge:c });
}

async function exchangeCode(code) {
  const v = sessionStorage.getItem('pkce_v');
  const r = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ grant_type:'authorization_code', code, redirect_uri:REDIRECT_URI, client_id:CLIENT_ID, code_verifier:v }) });
  const d = await r.json();
  if (d.access_token) { save(d); sessionStorage.removeItem('pkce_v'); window.history.replaceState({},'',' '); return d.access_token; }
  return null;
}

async function doRefresh() {
  const rf = localStorage.getItem('sp_rf');
  if (!rf) return null;
  const r = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ grant_type:'refresh_token', refresh_token:rf, client_id:CLIENT_ID }) });
  const d = await r.json();
  if (d.access_token) { save(d); return d.access_token; }
  return null;
}

function save(d) {
  localStorage.setItem('sp_tk', d.access_token);
  localStorage.setItem('sp_exp', Date.now() + d.expires_in * 1000);
  if (d.refresh_token) localStorage.setItem('sp_rf', d.refresh_token);
}

// トークンを一度だけ取得してキャッシュ
let _tokenPromise = null;
let _cachedToken = null;

async function getToken() {
  // キャッシュ済みで有効なら即返す
  if (_cachedToken) return _cachedToken;
  const t = localStorage.getItem('sp_tk'), exp = localStorage.getItem('sp_exp');
  if (t && exp && Date.now() < parseInt(exp) - 60000) { _cachedToken = t; return t; }
  // 同時呼び出し防止
  if (_tokenPromise) return _tokenPromise;
  _tokenPromise = _fetchToken().finally(() => { _tokenPromise = null; });
  return _tokenPromise;
}

async function _fetchToken() {
  const code = new URLSearchParams(window.location.search).get('code');
  if (code) {
    // URLからcodeを即座に消す
    window.history.replaceState({}, '', window.location.pathname);
    const t = await exchangeCode(code);
    if (t) { _cachedToken = t; return t; }
  }
  const t = await doRefresh();
  if (t) { _cachedToken = t; }
  return t;
}

function logout() {
  _cachedToken = null;
  ['sp_tk','sp_exp','sp_rf'].forEach(k=>localStorage.removeItem(k));
  location.reload();
}

async function api(ep) {
  const t = await getToken();
  if (!t) throw new Error('no token');
  const r = await fetch('https://api.spotify.com/v1'+ep, { headers:{ Authorization:'Bearer '+t } });
  if (r.status===204) return null;
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

let timeRange='short_term', chartType='line';

async function loadTopData() {
  try {
    const [tr,ar]=await Promise.all([
      api(`/me/top/tracks?limit=10&time_range=${timeRange}`),
      api(`/me/top/artists?limit=10&time_range=${timeRange}`)
    ]);
    const tracks=(tr?.items)||[];
    const artists=(ar?.items)||[];

    // アーティストIDで個別取得してジャンルを得る
    const artistIds=artists.filter(a=>a?.id).map(a=>a.id).join(',');
    let enrichedArtists=artists;
    if (artistIds) {
      try {
        const artData=await api(`/artists?ids=${artistIds}`);
        if (artData?.artists) enrichedArtists=artData.artists.map((a,i)=>a||artists[i]);
      } catch(e) {
        console.log('artist enrichment skipped:', e.message);
      }
    }

    const gc={};
    enrichedArtists.forEach(a=>(a?.genres||[]).forEach(g=>{gc[g]=(gc[g]||0)+1;}));

    const albumMap={};
    tracks.forEach(t=>{ if(!t?.album?.id) return; if(!albumMap[t.album.id]) albumMap[t.album.id]={album:t.album,artists:t.artists,count:0}; albumMap[t.album.id].count++; });
    const albums=Object.values(albumMap).sort((a,b)=>b.count-a.count).slice(0,10);

    renderStats(tracks,enrichedArtists);
    renderRankTracks(tracks);
    renderRankArtists(enrichedArtists);
    renderRankAlbums(albums);
    renderRankGenres(gc);
    renderGenreBars(gc);
    renderPie(gc);
  } catch(e) { console.error('loadTopData error:',e); }
}

async function loadPopularityRanking() {
  const el = document.getElementById('rank-genres');
  try {
    const data = await api(`/me/top/artists?limit=10&time_range=${timeRange}`);
    const artists = (data?.items || []).filter(a=>a);

    // popularityが0の場合はフォロワー数で代替
    const sorted = [...artists].sort((a,b)=>(b.followers?.total||0)-(a.followers?.total||0));

      const imgs = a.images || [];

        ? `${(followers/1000000).toFixed(1)}M`

function renderMonthlySummary() {
  const el = document.getElementById('monthly-summary');
  if (!el || !allHistory.length) { 
    if (el) el.innerHTML = '<div style="font-size:12px;color:var(--text3)">データを蓄積中...</div>';
    return; 
  }
  const now = new Date();
  const thisMonth = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}`;
  const lastMonth = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastMonthKey = `${lastMonth.getFullYear()}/${String(lastMonth.getMonth()+1).padStart(2,'0')}`;

  const calcMs = key => allHistory
    .filter(r => r.played_at.startsWith(key))
    .reduce((s,r) => s + (parseInt(r.duration_ms)||0), 0);

  const thisMs = calcMs(thisMonth);
  const lastMs = calcMs(lastMonthKey);
  const thisH = Math.round(thisMs/3600000*10)/10;
  const lastH = Math.round(lastMs/3600000*10)/10;
  const diff = Math.round((thisH-lastH)*10)/10;
  const sign = diff >= 0 ? '+' : '';
  const diffColor = diff >= 0 ? 'var(--spotify)' : '#FF6B6B';

  const totalTracks = allHistory.filter(r => r.played_at.startsWith(thisMonth)).length;
  const uniqueArtists = new Set(allHistory.filter(r => r.played_at.startsWith(thisMonth)).map(r => r.artist_name)).size;

  el.innerHTML = `
    <div style="font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:4px">今月の再生時間</div>
    <div style="font-size:32px;font-weight:700;letter-spacing:-1px;background:linear-gradient(135deg,var(--spotify),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${thisH}h</div>
    ${diff !== 0 || lastH > 0 ? `<div style="font-size:13px;font-weight:600;color:${diffColor};margin-top:4px">先月より ${sign}${diff}時間</div>` : ''}
    <div style="height:1px;background:var(--border);margin:12px 0"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:700;color:var(--spotify)">${totalTracks}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px">再生曲数</div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:700;color:var(--blue)">${uniqueArtists}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px">アーティスト</div>
      </div>
    </div>
  `;
}

function switchPlaytimeView(view, btn) {
  playtimeView = view;
  selectedMonth = null;
  document.querySelectorAll('#pt-month-btn,#pt-week-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  drawPlaytimeFromHistory();
}

function drawPlaytimeFromHistory() {
  const canvas = document.getElementById('playtime-chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  if (playtimeView === 'week') {
    drawWeeklyChart(ctx, canvas);
  } else {
    // 月間表示：データが1ヶ月以下なら今月の日別をデフォルト表示
    const months = [...new Set(allHistory.map(r => {
      const d = new Date(r.played_at);
      return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;
    }))];
    if (months.length <= 1 && months.length > 0) {
      showDayDetail(months[0]);
    } else {
      drawMonthlyChart(ctx, canvas);
    }
  }
}

function drawMonthlyChart(ctx, canvas) {
  // 月別集計
  const monthData = {};
  allHistory.forEach(row => {
    const d = new Date(row.played_at);
    const key = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = `${d.getMonth()+1}月`;
    if (!monthData[key]) monthData[key] = { label, ms: 0, key };
    monthData[key].ms += parseInt(row.duration_ms) || 0;
  });

  const sorted = Object.entries(monthData).sort((a,b)=>a[0].localeCompare(b[0]));
  const labels = sorted.map(([,v])=>v.label);
  const vals = sorted.map(([,v])=>Math.round(v.ms/3600000*10)/10);
  const keys = sorted.map(([k])=>k);

  // 先月比表示
  const summaryEl = document.getElementById('playtime-summary');
  if (vals.length >= 2) {
    const cur = vals[vals.length-1];
    const prev = vals[vals.length-2];
    const diff = Math.round((cur-prev)*10)/10;
    const sign = diff >= 0 ? '+' : '';
    summaryEl.style.color = diff >= 0 ? 'var(--spotify)' : '#FF6B6B';
    summaryEl.textContent = `先月より ${sign}${diff}時間`;
  } else if (vals.length === 1) {
    summaryEl.style.color = 'var(--text3)';
    summaryEl.textContent = `今月 ${vals[0]}時間再生`;
  }

  document.getElementById('month-detail-label').textContent = '月をクリックで日別表示';
  drawAreaChart(ctx, canvas, labels, vals, keys);
}

function drawWeeklyChart(ctx, canvas) {
  // 週別集計（直近8週）
  const weekData = {};
  const now = new Date();
  allHistory.forEach(row => {
    const d = new Date(row.played_at);
    const diff = Math.floor((now - d) / (7*24*3600*1000));
    if (diff > 7) return;
    const weekStart = new Date(d);
    weekStart.setDate(d.getDate() - d.getDay());
    const key = weekStart.toLocaleDateString('ja',{month:'short',day:'numeric'});
    if (!weekData[key]) weekData[key] = { label: key, ms: 0 };
    weekData[key].ms += parseInt(row.duration_ms) || 0;
  });

  const sorted = Object.entries(weekData).sort((a,b)=>a[0].localeCompare(b[0]));
  const labels = sorted.map(([,v])=>v.label);
  const vals = sorted.map(([,v])=>Math.round(v.ms/3600000*10)/10);

  const summaryEl = document.getElementById('playtime-summary');
  if (vals.length >= 2) {
    const cur = vals[vals.length-1];
    const prev = vals[vals.length-2];
    const diff = Math.round((cur-prev)*10)/10;
    const sign = diff >= 0 ? '+' : '';
    summaryEl.style.color = diff >= 0 ? 'var(--spotify)' : '#FF6B6B';
    summaryEl.textContent = `先週より ${sign}${diff}時間`;
  }

  document.getElementById('month-detail-label').textContent = '';
  drawAreaChart(ctx, canvas, labels, vals, null);
}

function showDayDetail(monthKey) {
  const canvas = document.getElementById('playtime-chart');
  const ctx = canvas.getContext('2d');
  selectedMonth = monthKey;

  // 日別集計
  const dayData = {};
  allHistory.forEach(row => {
    const d = new Date(row.played_at);
    const key = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;
    if (key !== monthKey) return;
    const day = d.getDate();
    if (!dayData[day]) dayData[day] = 0;
    dayData[day] += parseInt(row.duration_ms) || 0;
  });

  // その月の全日数を埋める
  const [year, month] = monthKey.split('/').map(Number);
  const daysInMonth = new Date(year, month, 0).getDate();
  const labels = [], vals = [];
  for (let i=1; i<=daysInMonth; i++) {
    labels.push(`${i}日`);
    vals.push(Math.round((dayData[i]||0)/3600000*10)/10);
  }

  const [,m] = monthKey.split('/');
  document.getElementById('month-detail-label').textContent = `${parseInt(m)}月の日別再生時間（クリックで戻る）`;
  document.getElementById('playtime-summary').textContent = `${parseInt(m)}月合計: ${Math.round(vals.reduce((s,v)=>s+v,0)*10)/10}時間`;
  document.getElementById('playtime-summary').style.color = 'var(--spotify)';

  drawAreaChart(ctx, canvas, labels, vals, null, true);
}

function drawAreaChart(ctx, canvas, labels, vals, keys=null, isDetail=false) {
  // canvasのサイズを確実に取得
  const parent = canvas.parentElement;
  const W = parent ? Math.max(parent.clientWidth, parent.offsetWidth, 400) : 500;
  const H = 200;
  canvas.style.width = '100%';
  canvas.style.height = H + 'px';
  canvas.width = W;
  canvas.height = H;
  ctx.clearRect(0,0,W,H);

  if (!labels.length) {
    ctx.fillStyle = 'var(--text3)';
    ctx.font = '12px DM Sans';
    ctx.textAlign = 'center';
    ctx.fillText('データを蓄積中...', W/2, H/2);
    return;
  }

  const pad = { t:16, r:20, b:32, l:8 };
  const w = W - pad.l - pad.r;
  const h = H - pad.t - pad.b;
  const max = Math.max(...vals, 0.1) * 1.2;
  const n = labels.length;
  const gx = i => pad.l + (i/(n-1||1)) * w;
  const gy = v => pad.t + h - (v/max)*h;

  // グリッド
  for (let i=0; i<=3; i++) {
    const y = pad.t + (h/3)*i;
    ctx.beginPath(); ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
    ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+w,y); ctx.stroke();
  }

  if (vals.every(v=>v===0)) {
    ctx.fillStyle = '#6a6a6a';
    ctx.font = '11px DM Sans';
    ctx.textAlign = 'center';
    ctx.fillText('この期間のデータがありません', W/2, H/2);
    return;
  }

  // 塗りつぶしエリア
  const grad = ctx.createLinearGradient(0, pad.t, 0, H-pad.b);
  grad.addColorStop(0, 'rgba(29,185,84,0.35)');
  grad.addColorStop(1, 'rgba(29,185,84,0.02)');

  ctx.beginPath();
  if (n === 1) {
    ctx.moveTo(gx(0)-2, gy(vals[0]));
    ctx.lineTo(gx(0)+2, gy(vals[0]));
  } else {
    // スムーズカーブ
    ctx.moveTo(gx(0), gy(vals[0]));
    for (let i=1; i<n; i++) {
      const cpx = (gx(i-1)+gx(i))/2;
      ctx.bezierCurveTo(cpx, gy(vals[i-1]), cpx, gy(vals[i]), gx(i), gy(vals[i]));
    }
  }
  ctx.lineTo(gx(n-1), H-pad.b);
  ctx.lineTo(gx(0), H-pad.b);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  // ライン
  ctx.beginPath();
  if (n === 1) {
    ctx.arc(gx(0), gy(vals[0]), 4, 0, Math.PI*2);
  } else {
    ctx.moveTo(gx(0), gy(vals[0]));
    for (let i=1; i<n; i++) {
      const cpx = (gx(i-1)+gx(i))/2;
      ctx.bezierCurveTo(cpx, gy(vals[i-1]), cpx, gy(vals[i]), gx(i), gy(vals[i]));
    }
  }
  ctx.strokeStyle = '#1DB954'; ctx.lineWidth = 2.5; ctx.lineJoin='round'; ctx.stroke();

  // ドット（月間表示時のみクリッカブル）
  labels.forEach((l,i) => {
    ctx.beginPath();
    ctx.arc(gx(i), gy(vals[i]), n > 20 ? 2 : 4, 0, Math.PI*2);
    ctx.fillStyle = '#1DB954'; ctx.fill();
    ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth=2; ctx.stroke();
  });

  // ラベル（間引き）
  const step = Math.ceil(n/10);
  ctx.fillStyle='#6a6a6a'; ctx.font='10px DM Sans'; ctx.textAlign='center';
  labels.forEach((l,i) => {
    if (i % step === 0 || i === n-1) ctx.fillText(l, gx(i), H-8);
  });

  // クリックイベント（月間でkeys指定時）
  if (keys && !isDetail) {
    canvas.onclick = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      let closest = 0, minDist = Infinity;
      labels.forEach((_,i) => {
        const dist = Math.abs(gx(i) - x);
        if (dist < minDist) { minDist = dist; closest = i; }
      });
      if (minDist < 30 && keys[closest]) showDayDetail(keys[closest]);
    };
    canvas.style.cursor = 'pointer';
  } else if (isDetail) {
    canvas.onclick = () => {
      selectedMonth = null;
      document.getElementById('month-detail-label').textContent = '月をクリックで日別表示';
      drawMonthlyChart(ctx, canvas);
    };
    canvas.style.cursor = 'pointer';
  } else {
    canvas.onclick = null;
    canvas.style.cursor = 'default';
  }
}

function renderGenreBars(gc) {
  const sorted=Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max=sorted[0]?.[1]||1, total=Object.values(gc).reduce((s,v)=>s+v,0);
  document.getElementById('genre-bars').innerHTML=sorted.map(([g,c],i)=>`
    <div class="genre-row">
      <div class="genre-name">${esc(g)}</div>
      <div class="genre-bar-wrap"><div class="genre-bar" style="width:${Math.round((c/max)*100)}%;background:linear-gradient(to right,${COLORS[i%10]},${COLORS[(i+1)%10]})"></div></div>
      <div class="genre-pct">${Math.round((c/total)*100)}%</div>
    </div>`).join('');
}

function renderPie(gc) {
  const sorted=Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const total=sorted.reduce((s,[,v])=>s+v,0)||1;
  const canvas=document.getElementById('pie-chart');
  const ctx=canvas.getContext('2d');
  const cx=60,cy=60,r=52,inner=28;
  ctx.clearRect(0,0,120,120);
  let angle=-Math.PI/2;
  sorted.forEach(([,c],i)=>{
    const slice=(c/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,angle,angle+slice); ctx.closePath();
    ctx.fillStyle=COLORS[i%10]; ctx.fill(); angle+=slice;
  });
  ctx.beginPath(); ctx.arc(cx,cy,inner,0,Math.PI*2); ctx.fillStyle='#141414'; ctx.fill();
  document.getElementById('pie-legend').innerHTML=sorted.slice(0,5).map(([g,c],i)=>
    `<div class="pie-legend-item"><div class="pie-dot" style="background:${COLORS[i%10]}"></div><span>${esc(g)} <span style="color:var(--text3)">${Math.round((c/total)*100)}%</span></span></div>`
  ).join('');
}

function switchRankTab(tab,btn) {
  document.querySelectorAll('.rank-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.rank-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('rank-'+tab).classList.add('active');
}

async function setTimeRange(range,btn) {
  document.querySelectorAll('.time-tabs .time-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  timeRange=range;
  const labels={short_term:'直近4週',medium_term:'6ヶ月',long_term:'全期間'};
  document.getElementById('pie-period').textContent=labels[range];
  await loadTopData();
}

function fmtMs(ms){const s=Math.floor(ms/1000);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function relTime(iso){const m=Math.floor((Date.now()-new Date(iso))/60000);if(m<1)return'たった今';if(m<60)return`${m}分前`;const h=Math.floor(m/60);if(h<24)return`${h}時間前`;return`${Math.floor(h/24)}日前`;}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>
